<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Exploration Quiz</title>
  <style>
    :root {
      --bg: #070b14;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --btn-bg: #131d33;
      --btn-border: #233454;
      --btn-hover: #1c2b4a;
      --correct-bg: #064e3b;
      --correct-border: #10b981;
      --correct-text: #6ee7b7;
      --correct-glow: rgba(16, 185, 129, 0.35);
      --wrong-bg: #7f1d1d;
      --wrong-border: #ef4444;
      --wrong-text: #fca5a5;
      --wrong-glow: rgba(239, 68, 68, 0.35);
      --hud-telemetry: #38bdf8;
      --hud-telemetry-bg: rgba(56, 189, 248, 0.12);
      --scanline-color: rgba(255, 255, 255, 0.025);
      --progress-track: #1e293b;
      --progress-fill: linear-gradient(90deg, #6366f1, #38bdf8);
      --shadow: 0 12px 36px -4px rgba(0, 0, 0, 0.7);
      --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --card-border: #cbd5e1;
        --text-main: #0f172a;
        --text-muted: #475569;
        --accent: #4f46e5;
        --accent-glow: rgba(79, 70, 229, 0.15);
        --btn-bg: #f8fafc;
        --btn-border: #cbd5e1;
        --btn-hover: #eef2f6;
        --correct-bg: #ecfdf5;
        --correct-border: #059669;
        --correct-text: #065f46;
        --correct-glow: rgba(5, 150, 105, 0.25);
        --wrong-bg: #fef2f2;
        --wrong-border: #dc2626;
        --wrong-text: #991b1b;
        --wrong-glow: rgba(220, 38, 38, 0.25);
        --hud-telemetry: #0369a1;
        --hud-telemetry-bg: rgba(3, 105, 161, 0.08);
        --scanline-color: rgba(0, 0, 0, 0.02);
        --progress-track: #e2e8f0;
        --progress-fill: linear-gradient(90deg, #4f46e5, #0ea5e9);
        --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
        --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-main);
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 20% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.75rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    /* Mission Control HUD frame accent */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--hud-telemetry), transparent);
      opacity: 0.85;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      background: var(--btn-bg);
      padding: 0.4rem 0.8rem;
      border-radius: 9px;
      border: 1.5px solid var(--card-border);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    /* Stage Badge - High visibility Mission Control telemetry */
    .stage-badge {
      border-color: var(--card-border);
      background: var(--btn-bg);
      color: var(--text-main);
    }

    .stage-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-right: 0.2rem;
    }

    .stage-counter {
      display: inline-flex;
      align-items: baseline;
      font-family: var(--font-mono);
    }

    .stage-current {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--hud-telemetry);
      line-height: 1;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .stage-divider {
      color: var(--text-muted);
      margin: 0 2px;
      font-size: 0.95rem;
      font-weight: 600;
      opacity: 0.6;
    }

    .stage-total {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .stage-pct-tag {
      font-size: 0.72rem;
      font-weight: 700;
      font-family: var(--font-mono);
      background: var(--hud-telemetry-bg);
      color: var(--hud-telemetry);
      border: 1px solid currentColor;
      padding: 0.15rem 0.45rem;
      border-radius: 5px;
      margin-left: 0.25rem;
    }

    .score-badge {
      color: var(--hud-telemetry);
      border-color: currentColor;
      background: var(--hud-telemetry-bg);
      font-weight: 700;
    }

    /* Calibrated Progress Display */
    .progress-container {
      margin-bottom: 1.5rem;
    }

    .progress-bar {
      position: relative;
      width: 100%;
      height: 10px;
      background: var(--progress-track);
      border-radius: 9999px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.25);
    }

    .progress-fill {
      height: 100%;
      width: 10%;
      background: var(--progress-fill);
      border-radius: 9999px;
      transition: width 0.35s ease;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Calibrated 10-stage tick marks & 50% midpoint indicator */
    .progress-ticks {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 2;
    }

    .progress-tick {
      width: 1px;
      height: 100%;
      background: var(--card-bg);
      opacity: 0.7;
    }

    .progress-tick.midpoint {
      width: 2px;
      background: var(--hud-telemetry);
      opacity: 0.9;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.35rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .progress-labels .mid-label {
      color: var(--hud-telemetry);
      font-weight: 700;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 1.25rem;
      color: var(--text-main);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .option-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      background: var(--btn-bg);
      border: 1.5px solid var(--btn-border);
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.2s ease, transform 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .option-btn:focus-visible {
      outline: 2px dashed var(--hud-telemetry);
      outline-offset: 3px;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--btn-hover);
      border-color: var(--hud-telemetry);
      transform: translateY(-1px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    /* HUD Reticle Corners for Mission Control display */
    .hud-corner {
      position: absolute;
      width: 7px;
      height: 7px;
      border-color: var(--hud-telemetry);
      opacity: 0;
      transition: opacity 0.2s ease, border-color 0.2s ease;
      pointer-events: none;
    }
    .hud-tl { top: 3px; left: 3px; border-top: 2px solid; border-left: 2px solid; }
    .hud-tr { top: 3px; right: 3px; border-top: 2px solid; border-right: 2px solid; }
    .hud-bl { bottom: 3px; left: 3px; border-bottom: 2px solid; border-left: 2px solid; }
    .hud-br { bottom: 3px; right: 3px; border-bottom: 2px solid; border-right: 2px solid; }

    .option-btn:hover:not(:disabled) .hud-corner,
    .option-btn:focus-visible .hud-corner,
    .option-btn.selected .hud-corner,
    .option-btn.correct .hud-corner,
    .option-btn.wrong .hud-corner {
      opacity: 1;
    }

    .option-content {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex: 1;
      min-width: 0;
      z-index: 1;
    }

    .option-prefix {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: var(--hud-telemetry);
      min-width: 48px;
      flex-shrink: 0;
    }

    .option-label {
      flex: 1;
      font-weight: 500;
      word-break: break-word;
    }

    /* Mission Control Telemetry Pill */
    .telemetry-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.25rem 0.55rem;
      border-radius: 6px;
      background: var(--hud-telemetry-bg);
      color: var(--hud-telemetry);
      border: 1px solid currentColor;
      margin-left: 0.5rem;
      flex-shrink: 0;
      z-index: 1;
      transition: all 0.2s ease;
    }

    .telemetry-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
    }

    /* Selected Element Scanline & Mission Control Display Treatment */
    .option-btn.selected::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        var(--scanline-color) 2px,
        var(--scanline-color) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* Selected + Correct (Telemetry Nominal / Verified) */
    .option-btn.selected.correct,
    .option-btn.correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      box-shadow: 0 0 16px var(--correct-glow), inset 0 0 10px rgba(16, 185, 129, 0.15) !important;
    }

    .option-btn.correct .hud-corner {
      border-color: var(--correct-border);
    }

    .option-btn.correct .option-prefix {
      color: var(--correct-text);
    }

    .option-btn.correct .telemetry-pill {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--correct-border);
      color: var(--correct-text);
    }

    .option-btn.selected.correct {
      animation: correctPulse 0.45s ease forwards;
    }

    .option-btn.selected.correct .telemetry-dot {
      animation: telemetryPulse 1s infinite alternate ease-in-out;
    }

    /* Selected + Wrong (Trajectory Alert / Telemetry Malfunction) */
    .option-btn.selected.wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text) !important;
      box-shadow: 0 0 16px var(--wrong-glow), inset 0 0 10px rgba(239, 68, 68, 0.15) !important;
      animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .option-btn.selected.wrong .hud-corner {
      border-color: var(--wrong-border);
    }

    .option-btn.selected.wrong .option-prefix {
      color: var(--wrong-text);
    }

    .option-btn.selected.wrong .telemetry-pill {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
    }

    .option-btn.selected.wrong .telemetry-dot {
      animation: telemetryBlink 0.35s infinite alternate ease-in-out;
    }

    /* Target vector revealed after incorrect selection */
    .option-btn.revealed-correct {
      border-style: dashed !important;
    }

    @keyframes telemetryPulse {
      0% { transform: scale(0.85); opacity: 0.6; }
      100% { transform: scale(1.35); opacity: 1; }
    }

    @keyframes telemetryBlink {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    @keyframes correctPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .option-btn,
      .option-btn.selected.correct,
      .option-btn.selected.wrong,
      .telemetry-dot,
      .results-emoji {
        animation: none !important;
        transition: none !important;
        transform: none !important;
      }
    }

    .feedback-box {
      margin-top: 0.5rem;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      display: none;
      align-items: flex-start;
      gap: 0.6rem;
      animation: fadeIn 0.25s ease;
    }

    .feedback-box.correct {
      display: flex;
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
      color: var(--correct-text);
    }

    .feedback-box.wrong {
      display: flex;
      background: var(--wrong-bg);
      border: 1px solid var(--wrong-border);
      color: var(--wrong-text);
    }

    .feedback-text {
      flex: 1;
      line-height: 1.45;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.25rem;
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .primary-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .primary-btn:active {
      transform: translateY(0);
    }

    /* Results Screen */
    .results-screen {
      display: none;
      text-align: center;
      padding: 1rem 0.5rem;
      animation: fadeIn 0.3s ease;
    }

    .results-emoji {
      font-size: 4rem;
      margin-bottom: 0.5rem;
      display: inline-block;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .results-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .results-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .score-summary {
      background: var(--btn-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .score-summary.passed {
      border-color: var(--correct-border);
      box-shadow: 0 0 16px var(--correct-glow);
    }

    .score-summary.failed {
      border-color: var(--wrong-border);
      box-shadow: 0 0 16px var(--wrong-glow);
    }

    .status-banner {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }

    .status-banner.passed {
      background: var(--correct-bg);
      color: var(--correct-text);
      border: 1.5px solid var(--correct-border);
    }

    .status-banner.failed {
      background: var(--wrong-bg);
      color: var(--wrong-text);
      border: 1.5px solid var(--wrong-border);
    }

    .score-big {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .score-summary.passed .score-big {
      color: var(--correct-text);
    }

    .score-summary.failed .score-big {
      color: var(--wrong-text);
    }

    .score-percent {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .pass-threshold-note {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="card" id="quiz-card">
      <!-- Quiz active screen -->
      <div id="quiz-view">
        <header class="header">
          <span class="badge stage-badge" id="question-badge" aria-label="Mission stage 1 of 10, 10 percent complete">
            <span class="stage-label">STAGE</span>
            <span class="stage-counter">
              <span class="stage-current" id="stage-current">01</span><span class="stage-divider">/</span><span class="stage-total" id="stage-total">10</span>
            </span>
            <span class="stage-pct-tag" id="stage-pct">10%</span>
          </span>
          <span class="badge score-badge" id="score-badge">TELEMETRY: 0 PTS</span>
        </header>

        <div class="progress-container">
          <div class="progress-bar" role="progressbar" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1" aria-label="Mission progress">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-ticks" aria-hidden="true">
              <span class="progress-tick"></span>
              <span class="progress-tick"></span>
              <span class="progress-tick"></span>
              <span class="progress-tick"></span>
              <span class="progress-tick"></span>
              <span class="progress-tick midpoint" title="50% Midpoint"></span>
              <span class="progress-tick"></span>
              <span class="progress-tick"></span>
              <span class="progress-tick"></span>
              <span class="progress-tick"></span>
              <span class="progress-tick"></span>
            </div>
          </div>
          <div class="progress-labels" aria-hidden="true">
            <span>0% LAUNCH</span>
            <span class="mid-label">50% MIDPOINT</span>
            <span>100% ORBIT</span>
          </div>
        </div>

        <section aria-live="polite">
          <h2 class="question-title" id="question-text">Loading question...</h2>
          <div class="options-list" id="options-container" role="radiogroup" aria-labelledby="question-text"></div>
        </section>

        <div class="feedback-box" id="feedback-box" role="alert">
          <span id="feedback-icon" aria-hidden="true"></span>
          <span class="feedback-text" id="feedback-text"></span>
        </div>

        <div class="action-row">
          <button class="primary-btn" id="next-btn" style="display: none;">Next Question &rarr;</button>
        </div>
      </div>

      <!-- Quiz results screen -->
      <div class="results-screen" id="results-view" role="region" aria-label="Quiz Results">
        <div class="results-emoji" id="results-emoji">🚀</div>
        <div class="status-banner" id="status-banner">STATUS: PENDING</div>
        <h2 class="results-title" id="results-title">Mission Complete!</h2>
        <p class="results-subtitle" id="results-subtitle">Stellar navigation through the cosmos.</p>

        <div class="score-summary" id="score-summary">
          <div class="score-big" id="final-score">0 / 10</div>
          <div class="score-percent" id="final-percent">0% Correct</div>
          <div class="pass-threshold-note">PASSING THRESHOLD: 7/10 (70%)</div>
        </div>

        <button class="primary-btn" id="restart-btn" style="width: 100%;">
          <span>Launch Again 🔄</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    const questions = [
      {
        question: "Who was the first human to journey into outer space in 1961?",
        options: ["Neil Armstrong", "Yuri Gagarin", "John Glenn", "Alan Shepard"],
        answer: 1,
        fact: "Yuri Gagarin orbited Earth aboard Vostok 1 on April 12, 1961."
      },
      {
        question: "Which NASA mission was the first to successfully land astronauts on the Moon?",
        options: ["Apollo 8", "Apollo 11", "Apollo 13", "Gemini 4"],
        answer: 1,
        fact: "Apollo 11 touched down on July 20, 1969, with Neil Armstrong and Buzz Aldrin."
      },
      {
        question: "What is the name of NASA's rover that landed on Mars in February 2021?",
        options: ["Curiosity", "Opportunity", "Perseverance", "Spirit"],
        answer: 2,
        fact: "Perseverance touched down in Jezero Crater carrying the Ingenuity helicopter."
      },
      {
        question: "Which space telescope launched on Christmas Day in 2021 to observe infrared light?",
        options: ["Hubble", "Spitzer", "James Webb", "Kepler"],
        answer: 2,
        fact: "The James Webb Space Telescope orbits the Sun at the second Lagrange point (L2)."
      },
      {
        question: "What is the largest planet in our solar system?",
        options: ["Saturn", "Neptune", "Jupiter", "Uranus"],
        answer: 2,
        fact: "Jupiter is more than twice as massive as all other planets combined."
      },
      {
        question: "Which robotic probe became the first human-made object to enter interstellar space?",
        options: ["Voyager 1", "Pioneer 10", "New Horizons", "Voyager 2"],
        answer: 0,
        fact: "Voyager 1 crossed the heliopause into interstellar space in August 2012."
      },
      {
        question: "What was the name of the first artificial satellite launched into orbit in 1957?",
        options: ["Explorer 1", "Sputnik 1", "Vanguard 1", "Telstar"],
        answer: 1,
        fact: "Sputnik 1 was launched by the Soviet Union on October 4, 1957."
      },
      {
        question: "Which moon of Saturn is famous for having a dense atmosphere and liquid methane lakes?",
        options: ["Enceladus", "Europa", "Titan", "Io"],
        answer: 2,
        fact: "Titan is the only moon in our solar system with a substantial atmosphere."
      },
      {
        question: "What is the boundary around a black hole beyond which nothing can escape?",
        options: ["Accretion Disk", "Singularity", "Photon Sphere", "Event Horizon"],
        answer: 3,
        fact: "The event horizon marks the point where escape velocity exceeds the speed of light."
      },
      {
        question: "Approximately how long does it take for light from the Sun to reach Earth?",
        options: ["8 seconds", "8 minutes", "8 hours", "1 day"],
        answer: 1,
        fact: "Traveling at 300,000 km/s, sunlight takes roughly 8 minutes and 20 seconds to reach us."
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let answered = false;

    const questionBadge = document.getElementById('question-badge');
    const stageCurrentEl = document.getElementById('stage-current');
    const stageTotalEl = document.getElementById('stage-total');
    const stagePctEl = document.getElementById('stage-pct');
    const scoreBadge = document.getElementById('score-badge');
    const progressFill = document.getElementById('progress-fill');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackBox = document.getElementById('feedback-box');
    const feedbackIcon = document.getElementById('feedback-icon');
    const feedbackText = document.getElementById('feedback-text');
    const nextBtn = document.getElementById('next-btn');

    const quizView = document.getElementById('quiz-view');
    const resultsView = document.getElementById('results-view');
    const resultsEmoji = document.getElementById('results-emoji');
    const statusBanner = document.getElementById('status-banner');
    const resultsTitle = document.getElementById('results-title');
    const resultsSubtitle = document.getElementById('results-subtitle');
    const scoreSummary = document.getElementById('score-summary');
    const finalScore = document.getElementById('final-score');
    const finalPercent = document.getElementById('final-percent');
    const restartBtn = document.getElementById('restart-btn');

    function updateProgress() {
      const currentStage = currentIndex + 1;
      const progressPercent = Math.round((currentStage / questions.length) * 100);
      progressFill.style.width = `${progressPercent}%`;
      const progressBar = document.querySelector('.progress-bar');
      if (progressBar) progressBar.setAttribute('aria-valuenow', currentStage);

      if (stageCurrentEl) stageCurrentEl.textContent = String(currentStage).padStart(2, '0');
      if (stageTotalEl) stageTotalEl.textContent = String(questions.length).padStart(2, '0');
      if (stagePctEl) stagePctEl.textContent = `${progressPercent}%`;
      if (questionBadge) {
        questionBadge.setAttribute(
          'aria-label',
          `Mission stage ${currentStage} of ${questions.length}, ${progressPercent} percent progress`
        );
      }
    }

    function renderQuestion() {
      answered = false;
      const current = questions[currentIndex];

      scoreBadge.textContent = `TELEMETRY: ${score} PTS`;
      questionText.textContent = current.question;
      updateProgress();

      feedbackBox.className = 'feedback-box';
      feedbackBox.style.display = 'none';
      nextBtn.style.display = 'none';

      optionsContainer.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      current.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.setAttribute('role', 'radio');
        btn.setAttribute('aria-checked', 'false');
        btn.setAttribute('tabindex', idx === 0 ? '0' : '-1');
        btn.setAttribute('aria-label', `Channel ${letters[idx]}: ${opt}`);
        btn.innerHTML = `
          <span class="hud-corner hud-tl" aria-hidden="true"></span>
          <span class="hud-corner hud-tr" aria-hidden="true"></span>
          <span class="hud-corner hud-bl" aria-hidden="true"></span>
          <span class="hud-corner hud-br" aria-hidden="true"></span>
          <div class="option-content">
            <span class="option-prefix">CH-${letters[idx]} //</span>
            <span class="option-label">${opt}</span>
          </div>
          <span class="telemetry-pill" aria-hidden="true">
            <span class="telemetry-dot"></span>
            <span class="telemetry-status">STANDBY</span>
          </span>
        `;

        btn.addEventListener('keydown', (e) => {
          if (answered) return;
          const allButtons = Array.from(optionsContainer.querySelectorAll('.option-btn'));
          let targetIndex = -1;

          if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
            e.preventDefault();
            targetIndex = (idx + 1) % allButtons.length;
          } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
            e.preventDefault();
            targetIndex = (idx - 1 + allButtons.length) % allButtons.length;
          } else if (e.key === 'Home') {
            e.preventDefault();
            targetIndex = 0;
          } else if (e.key === 'End') {
            e.preventDefault();
            targetIndex = allButtons.length - 1;
          }

          if (targetIndex >= 0) {
            allButtons.forEach((b, i) => b.setAttribute('tabindex', i === targetIndex ? '0' : '-1'));
            allButtons[targetIndex].focus();
          }
        });

        btn.addEventListener('click', () => handleSelect(idx));
        optionsContainer.appendChild(btn);
      });
    }

    function handleSelect(selectedIndex) {
      if (answered) return;
      answered = true;

      const current = questions[currentIndex];
      const buttons = optionsContainer.querySelectorAll('.option-btn');
      const isCorrect = selectedIndex === current.answer;

      buttons.forEach(btn => btn.disabled = true);

      // Selected element with mission-control telemetry lock
      const selectedBtn = buttons[selectedIndex];
      selectedBtn.setAttribute('aria-checked', 'true');
      selectedBtn.classList.add('selected');
      const selectedStatus = selectedBtn.querySelector('.telemetry-status');

      if (isCorrect) {
        score++;
        scoreBadge.textContent = `TELEMETRY: ${score} PTS`;
        selectedBtn.classList.add('correct');
        if (selectedStatus) selectedStatus.textContent = 'NOMINAL';
        selectedBtn.setAttribute('aria-label', `Selected: ${current.options[selectedIndex]}. Verified nominal.`);
        feedbackBox.className = 'feedback-box correct';
        feedbackIcon.textContent = '✅';
        feedbackText.innerHTML = `<strong>TELEMETRY CONFIRMED:</strong> ${current.fact}`;
      } else {
        selectedBtn.classList.add('wrong');
        if (selectedStatus) selectedStatus.textContent = 'TRAJ_ERR';
        selectedBtn.setAttribute('aria-label', `Selected: ${current.options[selectedIndex]}. Trajectory error.`);

        // Reveal the true trajectory vector
        const correctBtn = buttons[current.answer];
        correctBtn.classList.add('correct', 'revealed-correct');
        const correctStatus = correctBtn.querySelector('.telemetry-status');
        if (correctStatus) correctStatus.textContent = 'TRUE VECTOR';
        correctBtn.setAttribute('aria-label', `Target flight vector: ${current.options[current.answer]}`);

        feedbackBox.className = 'feedback-box wrong';
        feedbackIcon.textContent = '❌';
        feedbackText.innerHTML = `<strong>TRAJECTORY ALERT:</strong> ${current.fact}`;
      }

      feedbackBox.style.display = 'flex';
      nextBtn.style.display = 'inline-flex';
      nextBtn.textContent = (currentIndex === questions.length - 1) ? 'Review Flight Data ✨' : 'Next Stage →';
      nextBtn.focus();

      // Update progress bar to include current completed question
      const completedPercent = ((currentIndex + 1) / questions.length) * 100;
      progressFill.style.width = `${completedPercent}%`;
    }

    function handleNext() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      quizView.style.display = 'none';
      resultsView.style.display = 'block';

      finalScore.textContent = `${score} / ${questions.length}`;
      const percentage = Math.round((score / questions.length) * 100);
      finalPercent.textContent = `${percentage}% Correct`;

      const isPassed = score >= 7;

      if (isPassed) {
        statusBanner.className = 'status-banner passed';
        statusBanner.textContent = 'MISSION STATUS: PASSED // FLIGHT CERTIFIED';
        scoreSummary.className = 'score-summary passed';
      } else {
        statusBanner.className = 'status-banner failed';
        statusBanner.textContent = 'MISSION STATUS: FAILED // RETRY REQUIRED';
        scoreSummary.className = 'score-summary failed';
      }

      if (score === 10) {
        resultsEmoji.textContent = '🚀🏆';
        resultsTitle.textContent = 'Cosmic Legend!';
        resultsSubtitle.textContent = 'Flawless mission! You scored 10/10 and achieved flight certification.';
      } else if (score >= 8) {
        resultsEmoji.textContent = '👨‍🚀✨';
        resultsTitle.textContent = 'Flight Commander!';
        resultsSubtitle.textContent = 'Outstanding flight! You passed the qualifying examination.';
      } else if (score === 7) {
        resultsEmoji.textContent = '🛰️🎯';
        resultsTitle.textContent = 'Mission Certified!';
        resultsSubtitle.textContent = 'Target met! You achieved the passing mark of 7/10.';
      } else if (score >= 5) {
        resultsEmoji.textContent = '🛰️🔭';
        resultsTitle.textContent = 'Orbital Specialist (Needs Practice)';
        resultsSubtitle.textContent = 'Good attempt, but you need at least 7/10 to pass flight certification.';
      } else if (score >= 3) {
        resultsEmoji.textContent = '🛸🌌';
        resultsTitle.textContent = 'Cadet in Training';
        resultsSubtitle.textContent = 'Keep training. Review planetary navigation charts and try again.';
      } else {
        resultsEmoji.textContent = '☄️🪐';
        resultsTitle.textContent = 'Lost in Orbit!';
        resultsSubtitle.textContent = 'Expedition aborted. Re-run simulations to qualify for flight.';
      }

      restartBtn.focus();
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      resultsView.style.display = 'none';
      quizView.style.display = 'block';
      renderQuestion();
    }

    nextBtn.addEventListener('click', handleNext);
    restartBtn.addEventListener('click', restartQuiz);

    // Initial render
    renderQuestion();
  </script>
</body>
</html>
